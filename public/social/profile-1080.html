<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nexolve Technologies profile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    .frame {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }
    .mark {
      width: 52%;
      height: 52%;
    }
    .mark svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="mark">
      <!-- Matrix O: compact 2-ring cut (Deep Navy / Mid Blue) with Signal Blue inner ring and Core Cyan core -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Nexolve Technologies">
        <circle cx="48" cy="48" r="38" fill="none" stroke="#0B2A44" stroke-width="10" stroke-dasharray="3 10.264" stroke-linecap="butt" transform="rotate(-90 48 48)"/>
        <circle cx="48" cy="48" r="27" fill="none" stroke="#1A5A8A" stroke-width="7" stroke-dasharray="2.5 8.81" stroke-linecap="butt" transform="rotate(-90 48 48)"/>
        <circle cx="48" cy="48" r="17" fill="none" stroke="#4AA3DD" stroke-width="5" stroke-dasharray="2 6.901" stroke-linecap="butt" transform="rotate(-90 48 48)"/>
        <circle cx="48" cy="48" r="5" fill="#7FD0FF"/>
      </svg>
    </div>
  </div>
</body>
</html>
